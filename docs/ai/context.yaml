ai_creative_process:
  required:
    - "human/problem-led strategic brief"
    - "3+ independent strategic framings for brand-defining work; fixed territory names are not reusable default answers"
    - "phase-specific context: thin divergence context, full convergence/production context"
    - "brief → framing → low-fidelity human structure → AI prompt for brand-defining visual ideation"
    - "first-good-concept quarantine until independent territories exist"
    - "perspective-diverse independent Explorer branches; functional AI roles alone do not count as diversity"
    - "role-bound AI: Challenger, Explorer, Analyst, Builder, or Simulator"
    - "proprietary/real inputs without forcing preferred aesthetics during early divergence"
    - "independent evaluation before group discussion; blind/randomize creator or AI origin where practical"
    - "falsify preferred direction and steelman strongest rejected direction before final convergence"
    - "human ownership of strategic framing, farmer empathy, documentary truth, final taste and final selection"
    - "contextual plausibility review for agricultural scenes, data availability and implied product capability"
    - "granular transformation-level provenance for brand-critical AI-assisted assets"
    - "recognition/confusion testing where practical"
  forbidden_pattern: "one AI loop writes the brief, creates, judges and approves the same brand-defining work"
  divergence_context:
    include:
      - "farmer/user problem"
      - "desired outcome"
      - "factual product truth"
      - "evidence/VEV integrity"
      - "legal/accessibility constraints"
      - "necessary proprietary raw inputs"
    withhold_by_default:
      - "current leading art direction"
      - "other concept outputs"
      - "preferred composition"
      - "approved execution examples"
      - "candidate distinctive assets as mandatory motifs"
      - "full exclusion board"
  documentary_rule: "If AI materially adds/removes factual farm-scene content, classify the result as illustration/concept imagery rather than documentary agriculture."

motion:
  principle: "Use motion only if it helps farmers understand information lineage from farm reality to economic meaning faster or more correctly than the best static composition."
  field_economics_reveal:
    status: "candidate explanatory motion; not validated signature"
    domain: "Field Profitability (crop) expression; not a master-brand invariant"
    experiment_protocol: "docs/experiments/field-economics-motion-test-v1.md"
    gate: "run only after WWW-002 produces a surviving art-direction base"
    sequence:
      - "real farm"
      - "field scope / geometry"
      - "operational/data context + provenance"
      - "economic interpretation"
      - "evidence/confidence"
      - "decision question / next action"
    illustrative_labels:
