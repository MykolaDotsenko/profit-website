schema_version: 1
last_updated: "2026-09-27"
purpose: "Compact derived context for AI-assisted development of the PROFIT public website."
task_research_router: "For homepage implementation wording use docs/homepage-copy-deck-v1.md; for homepage content/hierarchy use docs/homepage-content-brief-v1.md plus canonical sources. For public website work involving product behavior, data collection, forecasting, DSS logic, trust or brand expression, use docs/website-trust-professionalism-synthesis-2026-09-27.md plus the task-specific canonical sources; do not load the full archive by default."
authority_note: "This is a derived summary. For product/content/design/implementation decisions, canonical documentation wins. AGENTS.md governs AI workflow/process."

authority:
  ai_workflow:
    - "explicit current user instruction"
    - "AGENTS.md"
  product_and_implementation:
    - "explicit current user instruction"
    - "docs/website-blueprint-v1.md"
    - "docs/triple-check-audit-2026-09-26.md for verified corrections not yet reflected elsewhere"
    - "docs/website-strategy.md"
    - "docs/ai/context.yaml"
    - "supporting research"

project:
  name: "PROFIT Website"
  repository: "MykolaDotsenko/profit-website"
  product_role: "Public presentation, trust, learning and qualified-conversion surface; not the core farm-management application."
  current_stage: "Provisional B2 production website implementation is active and regression-tested; the homepage is farmer-first and compressed; privacy/farm-data readiness is now documented and exposed on /trust while legal approval remains blocked; final release quality is governed by docs/release/website-100-scorecard.json plus hard release gates; team consent, hero/art-direction farmer validation, documentary assets, legal/company details and public-release gates remain open."

company_context:
  internal_mission: "Build a global Agricultural Decision Intelligence company by creating, proving and scaling superior Verified Economic Value for farmers."
  operating_principle: "Create Value. Prove It. Scale It."
  evidence_priority: "Customer-level evidence outranks global, leadership, scale, moat or valuation ambition."
  vev_standard: "docs/methodology/vev-standard-v1.md — approved internal v1: Verified requires attributed incremental effect, explicit counterfactual, reproducible economics, documented evidence, High/Medium assessed confidence and recorded review; verified effect may be positive, zero or negative."
  pilot_process: "docs/operations/pilot-intake-runbook-v1.md — primary owner Mykola Dotsenko; reply by email; target within two business days; fit/context first; no farm records before purpose/terms."
  scope_boundary:
    master_brand: "PROFIT"
    current_wedge: "Field Profitability"
    rule: "Do not crop-lock the master brand. Public company scope may name crops, horticulture/orchards/berries, greenhouse/protected cultivation, pigs, dairy and other livestock as direction; none may be presented as shipped unless canonical product truth supports it."
    master_brand_gate: "before master-brand homepage positioning is permanently locked, or before horticulture/greenhouse/livestock directions become public product domains, validate the master-brand proposition with relevant target users beyond the crop cohort; WWW-000 cannot close this gate; it does not block Field Profitability wedge learning"
    extensibility: "master brand, naming, IA, category language and visual system stay extensible across arable crops; horticulture/orchards/berries; greenhouse/protected cultivation; pig production; dairy; beef/grazing livestock; poultry/eggs; other livestock and mixed farms without rebranding; domain-specific metrics/units remain local; Field Profitability is the current first concrete product focus"
  public_claim_rule: "Internal ambition is not public proof."
  qualified_conversion:
    pilot_rule: "qualify current product fit before requesting contact details; five details only; no farm records"
    current_fit: "Field Profitability / arable-field economics is the first pilot focus; connected machinery is not required"
    non_fit: "do not imply full farm accounting, ERP, livestock modules or automated recommendation capability"
    investor_rule: "show what exists, what is hypothesis, what is not claimed, and what must be proven before scale"
    scale_rule: "comprehension/trust → observed value → attribution/VEV → retention/pull → repeatable economics → cross-domain transfer"


field_profitability_reference:
  canonical_source: "docs/website-blueprint-v1.md section 2.2 (internal product-truth boundary)"
  scope: "Field Profitability module only; does not define the PROFIT master-brand scope"
  status: "implemented vertical slice; MykolaDotsenko/PROFIT feat/field-profitability @ 7d07345; PR #1 closed without merge; unshipped; not production-verified"
  use_rule: "internal product-truth checks of website copy and proof objects only; never a public shipped or available claim"
  inputs: ["field", "crop", "season", "currency", "area", "yield", "price", "variable costs", "allocated fixed costs"]
  calculations: ["revenue", "variable costs", "allocated fixed costs", "operating costs", "gross margin", "operating profit", "revenue / ha", "cost / ha", "operating profit / ha", "operating margin %", "ROI on allocated costs", "break-even price", "break-even yield"]
  operating_profit: "revenue - variable costs - allocated fixed costs; not statutory net profit; not gross margin"
  exclusions: ["whole-farm P&L", "financing", "tax", "depreciation policy", "inventory accounting", "GIS", "scenario optimisation", "external telemetry", "ERP integrations"]
  ai_explanation: "may explain stored deterministic metrics; does not calculate financial truth"
  presentation: "several field records can be listed side by side in a saved-snapshots table (list pattern, not an analytics feature)"
  not_in_reference: ["assumptions model or UI", "assessed confidence attached to calculations"]

international_validation:
  principle: "Global by architecture. Local by evidence."
  operating_theatre: "EU-first, Europe-expandable"
  execution_rule: "Global-capable architecture; EU-first execution; country-level evidence."
  eu_rule: "EU is a shared regulatory/data theatre, not one pooled farmer cohort; validate country/region contexts independently."
  model: "Domain × Market × Evidence"
  cohort_rule: "Do not pool materially different countries/languages/market contexts into one qualitative cohort; analyse replication markets separately before cross-market comparison."
  domain:
    current: "crop / Field Profitability wedge"
    future_unshipped: ["horticulture / orchards / berries", "greenhouse / protected cultivation", "pig production", "dairy", "beef / grazing livestock", "poultry / eggs", "other livestock"]
  market_cohort_spec:
    required_fields: ["country", "region", "working language", "production context", "farm-size band", "decision-maker role", "digital maturity", "relevant economic context"]
    rule: "Market A is provisionally Finland subject to recruitment feasibility; D5 defines one coherent Finnish first cohort."
  evidence_maturity:
    I0: "International-ready architecture: market/domain assumptions are separable; locale/currency/unit/domain presentation is not treated as universal truth."
    I1: "One-market evidence: one defined target-market cohort supports the hypothesis for that market/domain."
    I2: "Cross-market replication: the same core job/mechanism is independently supported in a second market."
    I3: "Cross-market robustness: the hypothesis remains useful across materially different markets, with local adaptations separated from the invariant mechanism."
    I4: "Cross-domain validation: actual evidence supports the master economic/evidence grammar across materially different production systems, including crop plus horticulture/greenhouse and livestock contexts; internal design transfer is insufficient."
    I5: "International product evidence: repeatable VEV/customer value, retention and willingness-to-pay evidence exists across multiple markets/domains with explicit cohort/period/attribution."
    rule: "Internal maturity labels only; documenting a level does not achieve it and no global validation claim is allowed without evidence."
  economic_semantics:
    canonical: ["metric identity", "definition/formula/version", "numeric value", "currency", "production unit", "measurement period", "provenance/evidence state"]
    presentation: ["locale", "translated/display label", "number/currency/unit formatting"]
    rule: "Display strings such as €221/ha or local terms such as margin do not define the underlying economic metric."
  www_000_gates:
    D5: "Market Cohort Specification: define country, region, working language, crop/production context, farm-size band, decision-maker role, digital maturity and economic context; one coherent Market A cohort."
    D6: "Market-Specific Economic Scenario Validation after D5: domain expert validates crop, area, yield, price, currency, costs, operating profit, units and terminology; local values are not global truths. The statistical surrogate reduces placeholder-plausibility risk but does not close D6 or the public-release human-review blocker."
    D7: "Research Data / Consent Architecture: global principles = voluntary participation, purpose limitation, data minimisation, anonymised/pseudonymised handling, no personal data in public repo, explicit consent for recording; jurisdiction-specific overlay OPEN until Market A."
    D8: "Controlled Documentary Asset: one identical approved documentary crop image with source/rights/provenance; Market A test asset only, not global hero/master-brand identity; no synthetic documentary substitution."
  market_A:
    country: "Finland"
    status: "provisional; freeze only if recruitment gate succeeds"
    initial_region: "Southwest Finland (Varsinais-Suomi)"
    working_language: "Finnish"
    production_context: "cereal/oilseed/protein crop and arable farms relevant to Field Profitability"
    farm_size_band: "target 50-200 ha with justified exceptions; research-control choice, not a market-definition claim"
    decision_maker: "owner, manager or partner responsible for field-level crop/economic decisions"
    digital_maturity: "mixed; record current tools and avoid one-vendor/maturity dominance"
    recruitment_gate: "9-12 eligible crop decision-makers without obvious convenience/sample bias"
    evidence_note: "Luke 2025 structural data reports about 2,194 cereal-production enterprises in Southwest Finland; Finland has strong official farm-economics/crop data and documented profitability pressure."
  replication_candidates:
    adjacent: "Sweden"
    high_contrast: "Poland"
    cross_domain_future: "Denmark"
    other: ["Estonia", "Germany", "France"]
  next_decision: "While farmer access is unavailable, use the statistics-calibrated surrogate scenario and provisional H3 development default without claiming validation. Reopen human WWW-000 when recruitment becomes possible."

decision_intelligence_direction:
  status: "product-development doctrine; not a claim that current Field Profitability already implements all capabilities"
  public_methodology_surface:
    homepage: "concise only: fit the farm; quality before intelligence; keep uncertainty visible; link to /trust/#data-lifecycle"
    farmers: "practical data collection + quality path, including existing records, old machinery and offline-first direction; clearly label future capabilities"
    product: "current Field Profitability boundary: deterministic economics; forecasting/optimisation/activity recognition/scenario simulation are not current capabilities"
    trust: "inspectable data lifecycle + deterministic sensitivity + model-comparison discipline + decision-support architecture + evidence/confidence/privacy"
    company: "research-backed data strategy, data-quality gates, forecasting/model-selection doctrine and DSS design rationale"
    density_rule: "homepage remains a brochure surface, not a white paper; technical depth lives on trust/company/farmers"
  data_quality:
    sequence: ["completeness", "consistency", "duplicates", "anomalies", "freshness", "provenance", "representativeness"]
    rule: "data quality is assessed before model sophistication; weak input lowers confidence rather than being hidden by complexity"
  data_collection:
    principle: "work with the farm that exists"
    priority: ["reuse existing records", "automate reliable sources when available", "minimise operator input for old/non-connected machinery", "offline-first capture with later sync where required", "preserve provenance and farmer permission"]
    rule: "new hardware, telemetry and continuous connectivity are not universal prerequisites"
  forecasting:
    sequence: ["deterministic economics", "forecast uncertain domain drivers", "scenario comparison vs baseline", "decision", "actual outcome", "attribution/confidence", "VEV"]
    model_candidates: ["historical/naive baseline", "linear/regularised regression", "tree ensembles", "time-series/process/hybrid", "deep learning/foundation models only when justified"]
    model_rule: "baseline-first; increase ML complexity only when material out-of-sample gains and operational reliability justify it"
    validation_rule: "prefer temporal/rolling future-period validation and independent farm/field holdout where practical; random split alone is insufficient for decision-critical claims"
    uncertainty_rule: "show ranges, assumptions, update date and confidence; do not present one precise-looking black-box profit forecast"
    truth_rule: "LLM is not the quantitative source of truth; forecast accuracy alone is not Verified Economic Value"
  decision_support:
    sequence: ["state", "alternatives", "economic consequences", "uncertainty", "farmer decision", "actual outcome", "learning"]
    authority_rule: "PROFIT supports comparison; farmer retains decision authority"
    adoption_rule: "avoid technology-push DSS; fit end-user workflow and make uncertainty inspectable"
    current_boundary: "full predictive DSS is not a current shipped capability"

objectives:
  primary:
    - "Help a farmer understand what PROFIT is."
    - "Explain the farmer problem and economic relevance."
    - "Show how farm reality/data becomes economic decision support."
    - "Expose the evidence level and uncertainty behind claims."
    - "Make farmer data control and trust explicit."
    - "Create a clear next action."
  secondary:
    - "Give investors/partners a credible evidence-led path without turning the homepage into an investor pitch."

principles:
  - "Farmer value first."
  - "Investor narrative second."
  - "Evidence before hype."
  - "Simple surface, inspectable depth."
  - "Make confidence and uncertainty understandable."
  - "Farmer is the hero; PROFIT is the guide."
  - "No section exists because modern startup sites usually have it."

positioning:
  category:
    value: "Agricultural Decision Intelligence"
    state: "hypothesis"
  headline:
    value: "Turn farm data into more profitable decisions."
    state: "hypothesis"
  support:
    value: "PROFIT connects what happens on the farm with what it means economically."
    state: "hypothesis"
  primary_cta:
    value: "Join the pilot"
    state: "current recommendation"
  secondary_cta:
    value: "See how PROFIT works"
    state: "current recommendation"
  first_product_proof:
    value: "Field Profitability"
    state: "current wedge hypothesis"

value_logic:
  narrative:
    - "Farm reality"
    - "Data"
    - "Economic interpretation"
    - "Decision"
    - "Action"
    - "Measured outcome"
  vev_term: "Verified Economic Value"
  vev_measurement:
    primary: "VEV per Customer"
    supporting_when_evidence_allows:
      - "VEV per hectare or relevant production unit"
      - "VEV per unit of currency paid to PROFIT (e.g. per € in a euro market)"
      - "share of eligible customers with positive VEV"
      - "attribution confidence"
      - "defined measurement period and cohort"
    rule: "Do not invent missing VEV formulas, thresholds, attribution rules or verification criteria."
  evidence_states:
    - "Hypothetical"
    - "Modelled"
    - "Observed"
    - "Attributed"
    - "Verified"
  confidence_states:
    assessed:
      - "High"
      - "Medium"
      - "Low"
      - "Insufficient evidence"
    meta:
      - "Not assessed"
  locked_rules:
    - "Never present hypothetical/modelled value as observed, attributed or verified."
    - "Never use Verified unless the evidence and attribution standard is satisfied."
    - "Illustrative mockups must be unmistakably illustrative."
    - "Do not infer causal value from outcome alone."
    - "Do not fabricate partnerships, testimonials, integrations, savings or social proof."

trust_guardrails:
  - "Farmer data use must be permissioned and transparent."
  - "Do not make undocumented legal ownership/sharing claims."
  - "Privacy, security, auditability and farmer control are non-negotiable."
  - "Do not require sensitive farm data before trust and purpose are established."
  - "AI is not the sole source of truth for critical quantitative outputs."
  - "Real economic values require validated source data/rules/models and visible assumptions/provenance/period/uncertainty."
  - "Confidence must not exceed underlying data quality; consider completeness, consistency, freshness, provenance and representativeness."

audiences:
  primary: "Farmers and farm businesses"
  secondary:
    - "Investors"
    - "Partners"
    - "Advisors"

routes:
  core_launch:
    - "/"
    - "/farmers"
    - "/product"
    - "/trust"
    - "/company"
    - "/investors"
    - "/contact"
  conditional:
    results: "Add only when real pilot/case-study evidence supports a dedicated page."
    security: "Split from /trust only when content depth/customer requirements justify it."

hero_validation:
  status: "open human-validation hypothesis; H4 is the reversible development default from an owner-directed 2026-09-27 message refinement, not a production winner"
  experiment_protocol: "docs/experiments/hero-message-test-v1.md"
  stimulus: "prototypes/hero-message-test/"
  instrument_status: "drafted; the controlled WWW-000 instrument still contains H1/H2/H3 v2; D1-D4 settled; a Finnish statistical surrogate calibrated the scenario; H4 was added later as a development hypothesis and requires an explicit protocol/stimulus revision before controlled testing; human cohort/comprehension validation remains open"
  candidate_set: "H1/H2/H3 v2 remain the existing controlled set; H4 Economic decision clarity is a 2026-09-27 development hypothesis outside the current three-way instrument; no hero candidate has farmer evidence"
  surrogate_validation:
    source: "docs/experiments/www-000-statistical-surrogate-v1.md"
    status: "completed as risk-reduction evidence; not farmer evidence"
    calibrated_example: "Finnish Luke 2025 crop production/area + 2025 producer price + 2024 EconomyDoctor cereal-farm cost scale"
    provisional_default: "H4 — See the economics before you decide. Owner-directed development default; not covered by the earlier surrogate, no farmer evidence, no comprehension-winner claim"
    remaining_open: ["farmer 10-second comprehension", "category interpretation", "trust response", "Finnish language nuance", "CTA relevance", "documentary-asset response"]
  scope: "Field Profitability wedge message only; not a master-brand positioning test; results must not redefine PROFIT as field-crop-only (company_context.scope_boundary.extensibility)"
  product_truth_reference: "field_profitability_reference (Blueprint section 2.2); WWW-000 v2 check in hero-message-test-v1.md section 4.4"
  durable_rules:
    - "Hero comprehension must not depend on understanding the category label."
    - "A static first frame must communicate farmer + economic job + credible proof + next action."
    - "Hero visual is a proof object, not decorative agriculture."
    - "Test message independently from art direction before combined validation."
    - "Do not choose a hero by team preference or visual appeal."
  directions:
    H1: "Economic visibility / farmer job first"
    H2: "Decision intelligence / decision-context first (v2; v1 was the current control)"
    H3: "Field Profitability / product proof first"
    H4: "Economic decision clarity / farmer control first — development candidate, not yet in the three-way controlled instrument"
  first_test:
    cohort: "9-12 crop decision-makers from one Market A cohort (provisionally Finland, Southwest Finland, Finnish; international_validation.market_A); not pooled with other markets; qualitative elimination; no statistical-winner claim"
    method: "same neutral static scaffold; every participant evaluates H1/H2/H3 in counterbalanced order; Phase A: fixed 10 s exposure + open recall only, for all three; Phase B: second viewing + probes in the same order; Phase C: comparison"
    counting: "kill criteria counted across all participants per direction; first-position recall reported separately; repeated pattern = 3+ independent participants, 2 = concern; evidence-integrity failures corrected regardless of count"
  kill_patterns:
    - "material farmer-economic job is not understood"
    - "recurring misclassification"
    - "recurring guaranteed-profit interpretation"
    - "unsupported precision or scope"
    - "proof requires verbal explanation"
    - "hero depends on animation"
    - "CTA/next step is unclear"

art_direction_validation:
  status: "B2 Production Unit Grammar selected as provisional production direction; farmer validation remains open"
  experiment_protocol: "docs/experiments/art-direction-farmer-test-v1.md"
  research_reopen_rule: "Re-open external research only for a specific observed test failure, material open hypothesis, or time-sensitive constraint."
  selected_production_direction: "B2 — Production Unit Grammar"
  decision_record: "docs/decisions/0003-provisional-b2-production-unit-art-direction.md"
  selection_evidence: "internal A/B/C + A2/B2/C2 red-team, cross-domain transfer, anti-AI-sameness and product-truth fit; not farmer evidence"
  selected_grammar: "production unit → context / records → economics → evidence / confidence → farmer decision"
  selected_guardrail: "field geometry is crop-domain expression only; production unit is the master-brand invariant"
  implementation_status:
    state: "implemented provisionally across the coded website"
    surfaces: ["homepage hero", "page intros", "section rails", "production-system scope", "Field Profitability proof", "farmer-record intake", "methodology pipelines", "model comparison", "capability boundary", "CTA", "header/footer", "documentary asset placeholder"]
    mobile_rule: "headline/value first → economic proof/evidence → CTA → supporting production context"
    proof_rule: "Field Profitability example is rendered as a production-unit record, not a generic analytics dashboard"
    documentary_rule: "pending asset space is explicit; no generated/stock image is presented as documentary agriculture"
    market_stat_rule: "market statistics remain supporting context and must not visually outrank farmer economic proof"
    brochure_refinement: "production scope explicitly separates the domain-variable production unit from the invariant Production → Economics → Evidence → Decision discipline; split section rails are static rather than sticky application/documentation chrome; process surfaces use continuous decision-lineage / operational-ledger treatments rather than generic equal-weight cards; canonical B2 components expose design-validator-guarded brand-code markers; record lists vary by meaning; homepage evidence uses progressive disclosure; farmer-facing homepage depth is compressed by removing the duplicate decision-process comparison, keeping only Fit the farm + Keep uncertainty visible as homepage principles, and omitting the EU output statistic while deeper quality/model methodology stays on /trust and /company"
    verification_guard: "npm run verify includes design-system and English claim-hygiene checks before Astro/type/domain/build verification; edits to either validator trigger Site Verify"
  research_prior: "A — Evidence-Led Editorial was the earlier theoretical prior; it is retained as a challenger, not selected production direction"
  objective: "maximize farmer comprehension + calibrated trust"
  directions:
    A: "Evidence-Led Editorial — real farm truth + editorial hierarchy + economic typography + inspectable evidence"
    B: "Farm Operations Layer — farm reality + spatial/data layer + economics"
    C: "Economic Control Room — dense product/economic precision + supporting farm context"
  controlled_test_rule: "Use the same surviving message, proof scenario, evidence state, CTA hierarchy, no essential motion, and equivalent prototype fidelity across A/B/C. Share semantic/domain truth, not a mandatory composition. The current coded Hero/Section/ProofCard/FieldExample structure is an editorial-biased foundation and must not be imposed on all directions. Do not disclose the internal research prior to participants."
  composition_isolation: "WWW-001 directions own their hierarchy/layout/spatial logic; a tokens-only reskin of the coded foundation is not an independent direction."
  experiments:
    - "AD-1 10-second farmer comprehension"
    - "AD-2 evidence interpretation / calibrated trust"
    - "AD-3 mechanism reconstruction"
    - "AD-4 category-confusion diagnostic"
    - "AD-5 mobile farmer task"
    - "AD-6 trust under bad news/uncertainty"
    - "AD-7 brand-system transfer (surface transfer + internal crop/pig/dairy domain diagnostic)"
  master_brand_transfer_rule: "each direction is checked internally in crop production, pig production and dairy contexts with no fake product UI, no fabricated pig/dairy metrics and no shipped claims; a direction that needs field geometry for its identity is a master-brand scalability concern (it may remain a crop-module expression, not the master-brand system); domain transfer is not evidence of farmer comprehension in pig/dairy cohorts"
  category_confusion_risks:
    A: "consulting/report/editorial"
    B: "agronomy/satellite/mapping"
    C: "accounting/ERP/finance"
  decision_rule: "B2 is the current implementation decision, not a validated winner. Do not change it on aesthetics, novelty, investor preference or animation. Farmer comprehension and calibrated trust remain the validation criteria."
  reconsider_if: ["repeated GIS/telemetry misclassification", "production-unit grammar fails beyond crops", "logo-off recognition remains generic", "mobile comprehension worsens", "challenger materially outperforms B2 on comprehension + calibrated trust"]

