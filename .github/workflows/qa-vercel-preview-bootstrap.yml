name: QA Live Accessibility Edge Cases

on:
  push:
    branches:
      - qa/vercel-preview-bootstrap-2026-09-27

permissions:
  contents: read

jobs:
  live-a11y-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: "https://profit-website.vercel.app"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live reflow, text-spacing and forced-colors checks
        shell: bash
        run: |
          cat > live-a11y-edge.mjs <<'EOF'
          import { chromium } from '@playwright/test';

          const base = process.env.LIVE_BASE_URL;
          const routes = [
            '/', '/farmers/', '/product/', '/trust/', '/company/', '/investors/', '/contact/',
            '/uk/', '/fi/', '/da/'
          ];

          const browser = await chromium.launch();
          const failures = [];

          async function assertNoHorizontalOverflow(page, label) {
            const geometry = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              innerWidth: window.innerWidth,
            }));
            if (geometry.scrollWidth - geometry.clientWidth > 1) {
              failures.push(`${label}: horizontal overflow ${geometry.scrollWidth - geometry.clientWidth}px`);
            }
          }

          // WCAG 1.4.10 reflow proxy: 320 CSS px viewport.
          {
            const context = await browser.newContext({ viewport: { width: 320, height: 800 } });
            for (const route of routes) {
              const page = await context.newPage();
              const response = await page.goto(base + route, { waitUntil: 'networkidle' });
              if (!response?.ok()) failures.push(`320px ${route}: HTTP ${response?.status()}`);
              await assertNoHorizontalOverflow(page, `320px ${route}`);
              const mainVisible = await page.locator('main').isVisible();
              if (!mainVisible) failures.push(`320px ${route}: main not visible`);
              await page.close();
            }
            await context.close();
          }

          // WCAG 1.4.12 text-spacing stress values.
          {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            for (const route of routes) {
              const page = await context.newPage();
              await page.goto(base + route, { waitUntil: 'networkidle' });
              await page.addStyleTag({ content: `
                * { line-height: 1.5 !important; letter-spacing: 0.12em !important; word-spacing: 0.16em !important; }
                p { margin-bottom: 2em !important; }
              ` });
              await assertNoHorizontalOverflow(page, `text-spacing ${route}`);
              const clippedControls = await page.evaluate(() =>
                Array.from(document.querySelectorAll('a, button, input, select'))
                  .filter((el) => {
                    const r = el.getBoundingClientRect();
                    return r.width > 0 && r.height > 0 && (
                      r.right > document.documentElement.clientWidth + 1 ||
                      r.left < -1
                    );
                  })
                  .map((el) => (el.textContent || el.getAttribute('name') || el.tagName).trim().slice(0, 80))
                  .slice(0, 10)
              );
              if (clippedControls.length) failures.push(`text-spacing ${route}: clipped controls ${clippedControls.join(' | ')}`);
              await page.close();
            }
            await context.close();
          }

          // 200% text-only resize stress.
          {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            for (const route of routes) {
              const page = await context.newPage();
              await page.goto(base + route, { waitUntil: 'networkidle' });
              await page.evaluate(() => { document.documentElement.style.fontSize = '200%'; });
              await assertNoHorizontalOverflow(page, `200%-text ${route}`);
              await page.close();
            }
            await context.close();
          }

          // Forced-colors should retain content and focusable navigation.
          {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              forcedColors: 'active',
            });
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle' });
            if (!(await page.locator('main').isVisible())) failures.push('forced-colors: main not visible');
            await page.keyboard.press('Tab');
            const focused = await page.evaluate(() => {
              const el = document.activeElement;
              return el ? { tag: el.tagName, text: el.textContent?.trim().slice(0, 80), href: el.getAttribute('href') } : null;
            });
            if (!focused || focused.tag !== 'A') failures.push(`forced-colors: first tab target unexpected ${JSON.stringify(focused)}`);
            await page.close();
            await context.close();
          }

          await browser.close();

          if (failures.length) {
            console.error('LIVE A11Y EDGE FAILURES');
            for (const failure of failures) console.error('- ' + failure);
            process.exit(1);
          }

          console.log(`LIVE A11Y EDGE PASS: ${routes.length} routes at 320px, text-spacing stress, 200% text resize, and forced-colors keyboard smoke.`);
          EOF

          node ./live-a11y-edge.mjs
