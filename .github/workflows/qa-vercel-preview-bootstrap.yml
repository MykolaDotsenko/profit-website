name: QA Exact Fix Preview E2E

on:
  push:
    branches:
      - qa/vercel-preview-bootstrap-2026-09-27

permissions:
  contents: read

jobs:
  exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      LIVE_BASE_URL: "https://profit-website-l705yz86q-nikolais-projects-7d807184.vercel.app"

    steps:
      - name: Checkout exact fix candidate
        uses: actions/checkout@v4
        with:
          ref: "4d6e0bd0d380cf88a50dab4d6a00b98e04cb078d"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run verify
        env:
          SITE_INDEXABLE: "false"
          SHOW_CONTENT_STATUS: "true"
          PILOT_FORM_ENDPOINT: ""

      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium

      - name: Generate remote Playwright config
        shell: bash
        run: |
          cat > playwright.remote.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/browser',
            timeout: 30_000,
            expect: { timeout: 5_000 },
            fullyParallel: true,
            forbidOnly: true,
            retries: 1,
            workers: 4,
            reporter: 'list',
            use: {
              baseURL: process.env.LIVE_BASE_URL,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
          });
          EOF

      - name: Run all 121 browser/Axe/reflow tests against exact Vercel preview
        run: npx playwright test --config=playwright.remote.config.ts
