name: QA Live Vercel E2E

on:
  push:
    branches:
      - qa/vercel-preview-bootstrap-2026-09-27

permissions:
  contents: read

concurrency:
  group: qa-live-vercel-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      LIVE_BASE_URL: "https://profit-website.vercel.app"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify repository candidate
        run: npm run verify
        env:
          SITE_INDEXABLE: "false"
          SHOW_CONTENT_STATUS: "true"
          PILOT_FORM_ENDPOINT: ""

      - name: Install pinned browser-QA tools
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate live-origin Playwright config
        shell: bash
        run: |
          cat > playwright.live.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './tests/browser',
            timeout: 30_000,
            expect: { timeout: 5_000 },
            fullyParallel: true,
            forbidOnly: true,
            retries: 1,
            workers: 4,
            reporter: [['list'], ['html', { open: 'never', outputFolder: 'playwright-live-report' }]],
            use: {
              baseURL: process.env.LIVE_BASE_URL,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
          });
          EOF

      - name: Run full browser/Axe suite against live Vercel origin
        run: npx playwright test --config=playwright.live.config.ts

      - name: Verify live security, crawl and form-safety contract
        shell: bash
        run: |
          set -euo pipefail

          headers="$(mktemp)"
          home="$(mktemp)"
          curl -fsS -D "$headers" -o "$home" "$LIVE_BASE_URL/"

          grep -qi '^strict-transport-security: max-age=' "$headers"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' "$headers"
          grep -q 'name="robots" content="noindex, nofollow"' "$home"

          robots="$(curl -fsS "$LIVE_BASE_URL/robots.txt")"
          printf '%s\n' "$robots" | grep -q '^User-agent: \*$'
          printf '%s\n' "$robots" | grep -q '^Disallow: /$'

          sitemap_headers="$(mktemp)"
          sitemap="$(mktemp)"
          curl -fsS -D "$sitemap_headers" -o "$sitemap" "$LIVE_BASE_URL/sitemap-index.xml"
          grep -qi '^content-type: application/xml' "$sitemap_headers"
          grep -q '<urlset' "$sitemap"

          not_found="$(curl -sS -o /dev/null -w '%{http_code}' "$LIVE_BASE_URL/__qa-not-found__")"
          test "$not_found" = "404"

          contact="$(curl -fsS "$LIVE_BASE_URL/contact/")"
          form_tag="$(printf '%s' "$contact" | grep -o '<form[^>]*data-pilot-form[^>]*>' | head -1)"
          submit_tag="$(printf '%s' "$contact" | grep -o '<button[^>]*data-submit[^>]*>' | head -1)"
          ! printf '%s' "$form_tag" | grep -q ' action='
          ! printf '%s' "$form_tag" | grep -q ' method='
          printf '%s' "$submit_tag" | grep -q 'type="button"'
          printf '%s' "$contact" | grep -q 'This preview is not connected to a submission service yet. Nothing was sent.'

      - name: Upload live browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-playwright-report
          path: playwright-live-report
          if-no-files-found: ignore
          retention-days: 7
