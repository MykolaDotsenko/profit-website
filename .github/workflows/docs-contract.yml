name: Docs Contract

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "scripts/validate_ai_docs.py"
      - ".github/workflows/docs-contract.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "scripts/validate_ai_docs.py"
      - ".github/workflows/docs-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate AI documentation contract
        run: python scripts/validate_ai_docs.py
